<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Frelon Tracker">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="Frelon Tracker v3 avec calibrage spatial">
  <title>Frelon Tracker v3.0 🐝</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='20' fill='%23ff6b00'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23ffd700'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #video-container {
      position: relative;
      flex: 1;
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(1);
    }
    #video {
      display: none;
    }
    .tracker-dot {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ff00ff;
      box-shadow: 0 0 12px #ff00ff, 0 0 24px rgba(255, 0, 255, 0.5);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      transition: all 0.05s ease-out;
    }
    .calibration-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 30;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .calibration-overlay.active {
      display: flex;
    }
    .calibration-box {
      background: rgba(0, 0, 0, 0.9);
      border: 3px solid #00aa00;
      border-radius: 12px;
      padding: 30px;
      max-width: 90%;
      text-align: center;
    }
    .calibration-box h2 {
      color: #00aa00;
      margin-bottom: 15px;
      font-size: 18px;
    }
    .calibration-box p {
      color: #aaa;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.5;
    }
    .calibration-steps {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 20px 0;
    }
    .calibration-step {
      padding: 12px;
      background: rgba(0, 170, 0, 0.1);
      border: 1px solid #00aa00;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }
    .calibration-step.done {
      background: rgba(0, 170, 0, 0.3);
    }
    .calibration-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .cal-btn {
      padding: 10px 16px;
      background: #00aa00;
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .cal-btn:active {
      background: #00dd00;
    }
    .cal-btn.cancel {
      background: #666;
      color: #fff;
    }
    .debug-info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #0f0;
      font-family: monospace;
      z-index: 20;
      display: none;
    }
    .debug-info.visible {
      display: block;
    }
    .controls {
      padding: 16px;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    button {
      padding: 10px 20px;
      background: #ff6b00;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:active {
      background: #e55a00;
      transform: scale(0.98);
    }
    button:disabled {
      background: #666;
      opacity: 0.5;
      cursor: not-allowed;
    }
    button.secondary {
      background: #444;
      font-size: 12px;
      padding: 8px 12px;
    }
    button.secondary:active {
      background: #555;
    }
    button.calibrate {
      background: #00aa00;
      padding: 10px 16px;
      font-size: 13px;
    }
    button.calibrate:active {
      background: #00dd00;
    }
    .info {
      padding: 8px 16px;
      background: rgba(255, 107, 0, 0.1);
      border-left: 3px solid #ff6b00;
      font-size: 13px;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .info.hidden {
      display: none;
    }
    .status {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="tracker-dot" id="dot"></div>
    <div class="debug-info" id="debug"></div>
    
    <div class="calibration-overlay" id="calibrationOverlay">
      <div class="calibration-box">
        <h2>📐 Calibrage Spatial</h2>
        <p>Ce calibrage corrigera la distorsion de votre caméra.</p>
        <p style="font-size: 12px; color: #888;">Placez l'abricot à chaque position et appuyez sur "Valider"</p>
        
        <div class="calibration-steps">
          <div class="calibration-step" id="step1">1. Bas-gauche</div>
          <div class="calibration-step" id="step2">2. Bas-droite</div>
          <div class="calibration-step" id="step3">3. Haut-gauche</div>
          <div class="calibration-step" id="step4">4. Haut-droite</div>
        </div>
        
        <p id="calibProgress" style="color: #ffd700; font-weight: bold; margin-top: 15px;">Étape 1/4 : Placez l'abricot en bas à gauche</p>
        
        <div class="calibration-buttons">
          <button class="cal-btn" id="calibSubmitBtn">✓ Valider</button>
          <button class="cal-btn cancel" id="calibCancelBtn">✗ Annuler</button>
        </div>
      </div>
    </div>
  </div>

  <div class="info" id="info">
    <span>Caméra active • Suivi en cours</span>
    <div class="status">
      <div class="status-dot"></div>
      <span id="fps">30 fps</span>
    </div>
  </div>

  <div class="controls">
    <button id="startBtn">Démarrer caméra</button>
    <button id="stopBtn" disabled>Arrêter caméra</button>
    <button id="toggleTrack">Pause suivi</button>
    <button id="calibrateBtn" class="calibrate" disabled>⚙️ Calibrer</button>
    <button id="resetCalibBtn" class="secondary" disabled>Reset calib</button>
    <button id="toggleDebug" class="secondary">Debug OFF</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.log);
    }

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const dot = document.getElementById('dot');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const toggleTrackBtn = document.getElementById('toggleTrack');
    const toggleDebugBtn = document.getElementById('toggleDebug');
    const calibrateBtn = document.getElementById('calibrateBtn');
    const resetCalibBtn = document.getElementById('resetCalibBtn');
    const calibrationOverlay = document.getElementById('calibrationOverlay');
    const calibSubmitBtn = document.getElementById('calibSubmitBtn');
    const calibCancelBtn = document.getElementById('calibCancelBtn');
    const calibProgress = document.getElementById('calibProgress');
    const debugInfo = document.getElementById('debug');
    const infoBar = document.getElementById('info');
    const fpsDisplay = document.getElementById('fps');

    let isTracking = true;
    let isRunning = false;
    let debugMode = false;
    let frameCount = 0;
    let lastTime = performance.now();
    let lastDetectionX = 0;
    let lastDetectionY = 0;

    // Calibration
    let isCalibrating = false;
    let calibrationStep = 0;
    let calibrationPoints = [];
    let calibrationOffsets = { x: 0, y: 0 };

    // Charger les offsets depuis localStorage
    function loadCalibration() {
      const saved = localStorage.getItem('hornetTrackerCalibration');
      if (saved) {
        calibrationOffsets = JSON.parse(saved);
        resetCalibBtn.disabled = false;
        console.log('Calibration chargée:', calibrationOffsets);
      }
    }

    function saveCalibration() {
      localStorage.setItem('hornetTrackerCalibration', JSON.stringify(calibrationOffsets));
      resetCalibBtn.disabled = false;
    }

    loadCalibration();

    const colorThresholds = {
      minH: 15,
      maxH: 40,
      minS: 60,
      minL: 45,
    };

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      let h = 0, s = 0, l = (max + min) / 2;

      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
          case g: h = ((b - r) / d + 2) / 6; break;
          case b: h = ((r - g) / d + 4) / 6; break;
        }
      }
      return { h: h * 360, s: s * 100, l: l * 100 };
    }

    function isHornetColor(r, g, b) {
      const hsl = rgbToHsl(r, g, b);
      return (hsl.h >= colorThresholds.minH && hsl.h <= colorThresholds.maxH &&
              hsl.s >= colorThresholds.minS && hsl.l >= colorThresholds.minL);
    }

    function findLargestBlob(binaryPixels, w, h) {
      const visited = new Uint8Array(w * h);
      let maxBlobSize = 0;
      let maxBlobX = 0, maxBlobY = 0;

      function floodFill(startIdx) {
        const stack = [startIdx];
        let blobSize = 0, blobX = 0, blobY = 0;

        while (stack.length > 0) {
          const idx = stack.pop();
          if (visited[idx] || !binaryPixels[idx]) continue;

          visited[idx] = 1;
          blobSize++;
          blobX += idx % w;
          blobY += Math.floor(idx / w);

          if (idx - w >= 0) stack.push(idx - w);
          if (idx + w < w * h) stack.push(idx + w);
          if (idx % w > 0) stack.push(idx - 1);
          if (idx % w < w - 1) stack.push(idx + 1);
        }

        return { size: blobSize, x: blobX / blobSize, y: blobY / blobSize };
      }

      for (let i = 0; i < binaryPixels.length; i++) {
        if (binaryPixels[i] && !visited[i]) {
          const blob = floodFill(i);
          if (blob.size > maxBlobSize) {
            maxBlobSize = blob.size;
            maxBlobX = blob.x;
            maxBlobY = blob.y;
          }
        }
      }

      return { size: maxBlobSize, x: maxBlobX, y: maxBlobY };
    }

    function detectFrelon() {
      if (!isTracking || !isRunning) return;

      const w = canvas.width;
      const h = canvas.height;
      ctx.drawImage(video, 0, 0, w, h);

      const imageData = ctx.getImageData(0, 0, w, h);
      const data = imageData.data;

      const binaryPixels = new Uint8Array(w * h);
      let pixelCount = 0;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        if (isHornetColor(r, g, b)) {
          binaryPixels[i / 4] = 1;
          pixelCount++;
        }
      }

      if (pixelCount > 50) {
        const blob = findLargestBlob(binaryPixels, w, h);
        
        if (blob.size > 30) {
          // Adapter les coordonnées canvas aux pixels affichés
          const canvasRect = canvas.getBoundingClientRect();
          const scaleX = canvasRect.width / canvas.width;
          const scaleY = canvasRect.height / canvas.height;
          
          // Coordonnées en pixels affichés
          const displayX = blob.x * scaleX + canvasRect.left;
          const displayY = blob.y * scaleY + canvasRect.top;
          
          // Appliquer la correction de calibration
          const correctedX = displayX + calibrationOffsets.x * scaleX;
          const correctedY = displayY + calibrationOffsets.y * scaleY;
          
          dot.style.left = correctedX + 'px';
          dot.style.top = correctedY + 'px';
          dot.style.display = 'block';

          lastDetectionX = blob.x;
          lastDetectionY = blob.y;

          if (debugMode) {
            debugInfo.textContent = `Blob: ${blob.size}px\nCanvas: ${Math.round(blob.x)}, ${Math.round(blob.y)}\nAffichage: ${Math.round(displayX)}, ${Math.round(displayY)}\nCorrigée: ${Math.round(correctedX)}, ${Math.round(correctedY)}\nEchelle: ${scaleX.toFixed(2)}x${scaleY.toFixed(2)}\nOffset: (${calibrationOffsets.x.toFixed(1)}, ${calibrationOffsets.y.toFixed(1)})`;
          }
        } else {
          dot.style.display = 'none';
          if (debugMode) debugInfo.textContent = 'Blob trop petit';
        }
      } else {
        dot.style.display = 'none';
        if (debugMode) debugInfo.textContent = `Pixels: ${pixelCount}`;
      }
    }

    function animationLoop() {
      detectFrelon();

      frameCount++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        fpsDisplay.textContent = frameCount + ' fps';
        frameCount = 0;
        lastTime = now;
      }

      requestAnimationFrame(animationLoop);
    }

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          isRunning = true;
          startBtn.disabled = true;
          stopBtn.disabled = false;
          calibrateBtn.disabled = false;
          infoBar.classList.remove('hidden');
          animationLoop();
        };
      } catch (err) {
        alert('Impossible d\'accéder à la caméra.');
        console.error(err);
      }
    });

    stopBtn.addEventListener('click', () => {
      isRunning = false;
      video.srcObject.getTracks().forEach(track => track.stop());
      startBtn.disabled = false;
      stopBtn.disabled = true;
      calibrateBtn.disabled = true;
      dot.style.display = 'none';
      debugInfo.classList.remove('visible');
      infoBar.classList.add('hidden');
    });

    toggleTrackBtn.addEventListener('click', () => {
      isTracking = !isTracking;
      toggleTrackBtn.textContent = isTracking ? 'Pause suivi' : 'Reprendre suivi';
      if (!isTracking) dot.style.display = 'none';
    });

    toggleDebugBtn.addEventListener('click', () => {
      debugMode = !debugMode;
      toggleDebugBtn.textContent = debugMode ? 'Debug ON' : 'Debug OFF';
      toggleDebugBtn.style.background = debugMode ? '#00aa00' : '#444';
      if (debugMode) {
        debugInfo.classList.add('visible');
      } else {
        debugInfo.classList.remove('visible');
      }
    });

    calibrateBtn.addEventListener('click', () => {
      isCalibrating = true;
      calibrationStep = 0;
      calibrationPoints = [];
      calibrationOverlay.classList.add('active');
      updateCalibrationUI();
    });

    calibSubmitBtn.addEventListener('click', () => {
      if (lastDetectionX > 0 && lastDetectionY > 0) {
        // Enregistrer les coordonnées brutes du canvas
        calibrationPoints.push({ x: lastDetectionX, y: lastDetectionY });
        calibrationStep++;

        if (calibrationStep < 4) {
          updateCalibrationUI();
        } else {
          finishCalibration();
        }
      } else {
        alert('Pas d\'objet détecté. Placez l\'abricot et réessayez.');
      }
    });

    calibCancelBtn.addEventListener('click', () => {
      isCalibrating = false;
      calibrationStep = 0;
      calibrationPoints = [];
      calibrationOverlay.classList.remove('active');
    });

    function updateCalibrationUI() {
      const steps = ['step1', 'step2', 'step3', 'step4'];
      const positions = [
        'Bas-gauche',
        'Bas-droite',
        'Haut-gauche',
        'Haut-droite'
      ];

      steps.forEach((id, i) => {
        const el = document.getElementById(id);
        if (i < calibrationStep) {
          el.classList.add('done');
        } else {
          el.classList.remove('done');
        }
      });

      calibProgress.textContent = `Étape ${calibrationStep + 1}/4 : Placez l'abricot en ${positions[calibrationStep]}`;
    }

    function finishCalibration() {
      // Positions attendues (normalisées)
      const w = canvas.width;
      const h = canvas.height;
      const expectedPositions = [
        { x: w * 0.25, y: h * 0.75 },   // Bas-gauche
        { x: w * 0.75, y: h * 0.75 },   // Bas-droite
        { x: w * 0.25, y: h * 0.25 },   // Haut-gauche
        { x: w * 0.75, y: h * 0.25 }    // Haut-droite
      ];

      // Calculer les offsets moyens
      let totalOffsetX = 0, totalOffsetY = 0;
      calibrationPoints.forEach((point, i) => {
        totalOffsetX += expectedPositions[i].x - point.x;
        totalOffsetY += expectedPositions[i].y - point.y;
      });

      calibrationOffsets.x = totalOffsetX / 4;
      calibrationOffsets.y = totalOffsetY / 4;

      saveCalibration();
      
      alert(`✓ Calibration réussie !\nOffset: (${calibrationOffsets.x.toFixed(1)}, ${calibrationOffsets.y.toFixed(1)})`);
      
      isCalibrating = false;
      calibrationOverlay.classList.remove('active');
    }

    resetCalibBtn.addEventListener('click', () => {
      if (confirm('Réinitialiser la calibration ?')) {
        calibrationOffsets = { x: 0, y: 0 };
        localStorage.removeItem('hornetTrackerCalibration');
        resetCalibBtn.disabled = true;
        alert('Calibration réinitialisée');
      }
    });
  </script>
</body>
</html>
